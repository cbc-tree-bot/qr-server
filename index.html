<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Generator v6</title>
</head>
<body>

<div id="qr"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);

// Hardening
const data = (params.get("data") || "").substring(0, 2048);
const size = Math.min(Math.max(parseInt(params.get("size") || "200", 10), 120), 600);

// Generate QR off-screen
const container = document.getElementById("qr");
new QRCode(container, {
  text: data,
  width: size,
  height: size,
  correctLevel: QRCode.CorrectLevel.M
});

// Wait for QR to render, then redirect to image
setTimeout(() => {
  const img = container.querySelector("img");
  if (img && img.src.startsWith("data:image")) {
    // Redirect so Excel receives IMAGE, not HTML
    window.location.replace(img.src);
  }
}, 0);
</script>

</body>
</html>
