<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Generator V2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: white;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="qr"></canvas>

<script>
/*!
 * qrcode-generator
 * MIT License
 * https://github.com/kazuhikoarase/qrcode-generator
 */
(function () {
  function QRCode(typeNumber, errorCorrectionLevel) {
    this.typeNumber = typeNumber;
    this.errorCorrectionLevel = errorCorrectionLevel;
    this.modules = null;
    this.moduleCount = 0;
    this.dataCache = null;
    this.dataList = [];
  }

  QRCode.prototype.addData = function (data) {
    this.dataList.push(data);
    this.dataCache = null;
  };

  QRCode.prototype.make = function () {
    this.typeNumber = 0;
    this.modules = null;
    this.dataCache = null;

    const qr = qrcode(0, this.errorCorrectionLevel);
    this.dataList.forEach(d => qr.addData(d));
    qr.make();

    this.modules = qr.modules;
    this.moduleCount = qr.moduleCount;
  };

  window.qrcode = function (typeNumber, errorCorrectionLevel) {
    return new QRCode(typeNumber, errorCorrectionLevel);
  };
})();

/* ===== Read query parameters ===== */
const params = new URLSearchParams(window.location.search);
const data = params.get("data") || "";
const size = parseInt(params.get("size") || "200", 10);

/* ===== Generate QR ===== */
const qr = qrcode(0, 'M');
qr.addData(data);
qr.make();

const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");

const modules = qr.modules;
const count = qr.moduleCount;
const scale = Math.max(1, Math.floor(size / count));

canvas.width = count * scale;
canvas.height = count * scale;

/* White background */
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, canvas.width, canvas.height);

/* Draw QR */
ctx.fillStyle = "#000000";
for (let r = 0; r < count; r++) {
  for (let c = 0; c < count; c++) {
    if (modules[r][c]) {
      ctx.fillRect(c * scale, r * scale, scale, scale);
    }
  }
}
</script>
</body>
</html>
