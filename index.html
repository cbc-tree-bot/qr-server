<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Generator</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: white;
  }
  #qr {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="qr"></div>

<!-- Proven QR library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* ===============================
   Parameters & hardening
================================ */
const params = new URLSearchParams(window.location.search);

// Cap data length (prevents abuse)
const data = (params.get("data") || "").substring(0, 2048);

// Clamp size
const requestedSize = parseInt(params.get("size") || "200", 10);
const size = Math.min(Math.max(requestedSize, 120), 600);

// Clear container (important for Excel reloads)
document.getElementById("qr").innerHTML = "";

/* ===============================
   Generate QR
================================ */
new QRCode(document.getElementById("qr"), {
  text: data,
  width: size,
  height: size,
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
